<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Al Misbah - Streaming</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #1a5c37;
            --secondary: #d4af37;
            --accent: #8b7355;
            --bg: linear-gradient(135deg, #f5f3ed 0%, #e8e5dc 100%);
            --card-bg: #ffffff;
            --text-dark: #2d3436;
            --shadow: rgba(0,0,0,0.1);
        }
        
        body { background: var(--bg); padding-bottom: 150px; font-family: 'Poppins', sans-serif; color: var(--text-dark); }
        .date-banner { background: var(--primary); color: white; padding: 10px 0; font-size: 0.85rem; border-bottom: 2px solid var(--secondary); }
        .hijri-date { color: var(--secondary); font-family: 'Amiri', serif; font-size: 1.1rem; }
        
        .navbar { background: linear-gradient(135deg, var(--primary) 0%, #2d7a4d 100%) !important; box-shadow: 0 4px 10px var(--shadow); }
        .nav-link { font-size: 0.75rem; font-weight: 600; transition: 0.3s; }
        .nav-link i { font-size: 1.2rem; margin-bottom: 3px; }

        .card-profile { background: var(--card-bg); border-radius: 20px; padding: 25px; margin-bottom: 25px; box-shadow: 0 10px 40px var(--shadow); border: none; }
        .video-container { border-radius: 15px; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.15); border: 3px solid var(--secondary); margin-bottom: 20px; }

        /* Sholat Box Style */
        .sholat-box { background: #fcfbf7; border: 1px solid #eee; border-radius: 12px; padding: 10px; transition: 0.3s; }
        .sholat-name { font-size: 0.75rem; color: #888; font-weight: 600; text-transform: uppercase; }
        .sholat-time { font-size: 1.1rem; color: var(--primary); font-weight: 700; }

        .sticky-player { position: fixed; bottom: 0; width: 100%; background: #1a1a1a; color: white; padding: 15px; z-index: 1000; border-top: 3px solid var(--secondary); box-shadow: 0 -5px 20px rgba(0,0,0,0.3); }
        .page-section { display: none; animation: fadeIn 0.5s ease; }
        .active-section { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .market-card { background: white; border-radius: 15px; padding: 12px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05); height: 100%; border: 1px solid #eee; }
        .thumb { width: 100%; height: 110px; object-fit: cover; border-radius: 10px; }
    </style>
</head>
<body>

<div class="date-banner text-center">
    <div class="container">
        <span id="tanggalHijriyah" class="hijri-date text-warning"><i class="fas fa-moon me-2"></i></span>
        <span class="mx-2 text-white-50">|</span>
        <span id="tanggalMasehi"><i class="far fa-calendar me-2"></i></span>
    </div>
</div>

<nav class="navbar navbar-expand navbar-dark sticky-top">
    <div class="container text-center">
        <div class="navbar-nav mx-auto w-100 justify-content-between">
            <a class="nav-link text-white px-0" href="#" onclick="showPage('profil')"><i class="fas fa-home d-block"></i>RADIO</a>
            <a class="nav-link text-white px-0" href="#" onclick="showPage('sholat')"><i class="fas fa-clock d-block"></i>SHOLAT</a>
            <a class="nav-link text-white px-0" href="#" onclick="showPage('jadwal')"><i class="fas fa-calendar-alt d-block"></i>KAJIAN</a>
            <a class="nav-link text-white px-0" href="#" onclick="showPage('infaq')"><i class="fas fa-heart d-block"></i>INFAQ</a>
            <a class="nav-link text-white px-0" href="#" onclick="showPage('market')"><i class="fas fa-store d-block"></i>PASAR</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div id="profil" class="page-section active-section">
        <div class="row">
            <div class="col-12 mb-3"><div class="video-container"><div class="ratio ratio-16x9"><iframe id="v1" allowfullscreen></iframe></div></div></div>
            <div class="col-md-6 mb-3"><div class="video-container"><div class="ratio ratio-16x9"><iframe id="v2" allowfullscreen></iframe></div></div></div>
            <div class="col-md-6 mb-3"><div class="video-container"><div class="ratio ratio-16x9"><iframe id="v3" allowfullscreen></iframe></div></div></div>
        </div>
        <div class="card-profile text-center">
            <h3 id="rNama" class="fw-bold">Radio Al Misbah</h3>
            <h6 id="rSlogan" class="text-success fw-bold"></h6>
            <p id="rDesk" class="mt-3 text-muted small"></p>
        </div>
    </div>

    <div id="sholat" class="page-section">
        <div class="card-profile">
            <h4 class="text-center mb-4"><i class="fas fa-pray me-2 text-success"></i>Jadwal Sholat</h4>
            <div id="jadwal-sholat-api" class="row row-cols-2 row-cols-md-5 g-2 text-center">
                <div class="col-12 text-muted">Mengambil data jadwal...</div>
            </div>
            <p class="text-center mt-4 text-muted small">
                <i class="fas fa-map-marker-alt me-1 text-danger"></i> <span id="lblWilayah">Memuat Wilayah...</span>
            </p>
        </div>
    </div>

    <div id="jadwal" class="page-section">
        <div class="card-profile">
            <h5 class="fw-bold mb-3 text-success"><i class="fas fa-book-quran me-2"></i>Jadwal Kajian</h5>
            <div id="txtJadwal" style="white-space:pre-line;" class="small text-muted"></div>
        </div>
    </div>

    <div id="infaq" class="page-section">
        <div class="card-profile">
            <h5 class="fw-bold mb-3 text-success"><i class="fas fa-coins me-2"></i>Informasi Infaq</h5>
            <div id="txtInfaq" style="white-space:pre-line;" class="small text-muted"></div>
        </div>
    </div>

    <div id="market" class="page-section">
        <div id="listMarket" class="row g-3"></div>
    </div>
</div>

<div class="sticky-player text-center">
    <p id="info-lagu" class="small mb-2 text-warning"><i class="fas fa-broadcast-tower me-2"></i>Menghubungkan...</p>
    <audio id="radioPlayer" controls class="w-100" style="height: 35px;">
        <source id="audioSrc" src="" type="audio/mpeg">
    </audio>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentVideos = { v1: "", v2: "", v3: "" };
    let currentCity = "Gresik"; // Default awal

    function showPage(id) {
        document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active-section'));
        document.getElementById(id).classList.add('active-section');
        window.scrollTo(0,0);
    }

    function updateDates() {
        const m = new Date();
        const opt = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('tanggalMasehi').innerHTML = '<i class="far fa-calendar me-2"></i>' + m.toLocaleDateString('id-ID', opt);
        
        fetch(`https://api.aladhan.com/v1/gToH?date=${m.getDate()}-${m.getMonth()+1}-${m.getFullYear()}`)
        .then(r => r.json()).then(data => {
            const h = data.data.hijri;
            document.getElementById('tanggalHijriyah').innerHTML = `<i class="fas fa-moon me-2"></i>${h.day} ${h.month.en} ${h.year} H`;
        });
    }

    function loadJadwalSholat() {
        fetch('https://api.aladhan.com/v1/timingsByAddress?address=Gresik,Indonesia&method=11')
        .then(r => r.json()).then(res => {
            const t = res.data.timings;
            const items = [{n:'Subuh', w:t.Fajr}, {n:'Dzuhur', w:t.Dhuhr}, {n:'Ashar', w:t.Asr}, {n:'Maghrib', w:t.Maghrib}, {n:'Isya', w:t.Isha}];
            let html = "";
            items.forEach(s => {
                html += `<div class="col"><div class="sholat-box"><div class="sholat-name">${s.n}</div><div class="sholat-time">${s.w}</div></div></div>`;
            });
            document.getElementById('jadwal-sholat-api').innerHTML = html;
            document.getElementById('lblWilayah').innerText = "Wilayah " + currentCity + " & Sekitarnya";
        }).catch(() => {
            document.getElementById('jadwal-sholat-api').innerHTML = "Gagal mengambil jadwal.";
        });
    }

    function loadData() {
        fetch('data_web.json?v=' + Date.now())
        .then(r => r.json()).then(data => {
            // Update Teks Profil
            document.getElementById('rNama').innerText = data.nama_radio || "Radio Al Misbah";
            document.getElementById('rSlogan').innerText = data.slogan || "";
            document.getElementById('rDesk').innerText = data.deskripsi || "";
            
            // Cek jika Kota di data_web.json berubah
            if(data.kota && data.kota !== currentCity) {
                currentCity = data.kota;
                loadJadwalSholat();
            }

            // Update URL Radio Jika Ada
            if(data.url_stream) {
                const audio = document.getElementById('radioPlayer');
                const source = document.getElementById('audioSrc');
                if(source.src !== data.url_stream) {
                    source.src = data.url_stream;
                    audio.load();
                }
            }
            
            // Video (Hanya update jika ID berubah agar tidak refresh)
            if(data.video1 && currentVideos.v1 !== data.video1) { document.getElementById('v1').src = "https://www.youtube.com/embed/"+data.video1; currentVideos.v1 = data.video1; }
            if(data.video2 && currentVideos.v2 !== data.video2) { document.getElementById('v2').src = "https://www.youtube.com/embed/"+data.video2; currentVideos.v2 = data.video2; }
            if(data.video3 && currentVideos.v3 !== data.video3) { document.getElementById('v3').src = "https://www.youtube.com/embed/"+data.video3; currentVideos.v3 = data.video3; }

            document.getElementById('txtJadwal').innerText = data.jadwal || "Belum ada jadwal kajian.";
            document.getElementById('txtInfaq').innerText = data.infaq || "Belum ada data laporan.";
            document.getElementById('info-lagu').innerHTML = '<i class="fas fa-broadcast-tower me-2 text-danger"></i>' + (data.status_radio || "Radio Online");

            // Marketplace
            let mHtml = "";
            (data.produk || []).forEach(p => {
                mHtml += `<div class="col-6 col-md-3"><div class="market-card"><img src="images/${p.img}" class="thumb" onerror="this.src='https://via.placeholder.com/150'"><div class="small fw-bold mt-2 text-truncate">${p.nama}</div><div class="text-success small fw-bold">${p.harga}</div><a href="https://wa.me/${p.wa}" class="btn btn-success btn-sm w-100 mt-2 p-1 small">Pesan</a></div></div>`;
            });
            document.getElementById('listMarket').innerHTML = mHtml;
        });
    }

    window.onload = () => {
        updateDates();
        loadData(); // Ini juga akan memanggil loadJadwalSholat secara otomatis
        
        // Refresh data tiap 15 detik (kecuali video yang sama)
        setInterval(loadData, 15000);
        // Refresh jam dan tanggal tiap jam
        setInterval(() => { updateDates(); loadJadwalSholat(); }, 3600000);
    };
</script>
</body>
</html>
